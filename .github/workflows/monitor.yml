name: Monitor Tokyo UR vacancies

on:
  workflow_dispatch:
    inputs:
      notify_initial:
        description: "Notify every current vacancy when no baseline exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ur-vacancy-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check UR vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UR_CITIES: ${{ vars.UR_CITIES }}
          UR_LAYOUTS: ${{ vars.UR_LAYOUTS }}
          UR_MAX_RENT_YEN: ${{ vars.UR_MAX_RENT_YEN || '100000' }}
          UR_MAX_COMMUTE_MINUTES: ${{ vars.UR_MAX_COMMUTE_MINUTES || '60' }}
        run: |
          extra=""
          if [ "${{ inputs.notify_initial }}" = "true" ]; then extra="--notify-initial"; fi
          python src/ur_monitor.py $extra

      - name: Persist vacancy snapshot
        run: |
          if git diff --quiet -- data/state.json && ! git ls-files --others --exclude-standard -- data/state.json | grep -q .; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update UR vacancy snapshot"
          git push

